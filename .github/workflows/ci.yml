name: CI

# Order matters and is the whole design.
#
# lint and the metric run against the committed tree, BEFORE Playwright. The
# specs rewrite docs/screenshots/, and this runner renders Linux antialiasing
# against Mac-made blobs, so a capture regenerated here never matches the
# sha256 the sidecar recorded at capture time. Running the metric after the
# suite would fail every pull request for a difference that is not a defect.
#
# Nothing regenerated on this runner is ever compared to a commit or committed.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm

      - run: npm ci

      - name: Build types and API
        run: |
          npm run build -w @loop/types
          npm run build -w @loop/api

      # Four gates: vocabulary, prose, capture, evidence.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test --workspaces

      # The committed captures, before anything can overwrite them.
      - name: User-flow metric
        run: |
          count=$(python3 scripts/measure_user_flow.py)
          echo "user-flow captures: $count"
          if [ "$count" != "5" ]; then
            echo "::error::expected 5 valid user-flow captures, got $count"
            python3 scripts/measure_user_flow.py >/dev/null
            exit 1
          fi

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        run: npx playwright test

      # The suite rewrote docs/screenshots/ with Linux renders. They are
      # scratch: never compared to a commit, never committed.
      - name: Discard regenerated captures
        if: always()
        run: git checkout -- docs/screenshots/ || true
